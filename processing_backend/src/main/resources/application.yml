spring:
  application:
    name: processing_backend
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${MAX_PDF_SIZE_MB:20}MB
      max-request-size: ${MAX_PDF_SIZE_MB:20}MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/document_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Embedding autoconfig deferred until embedding phases; providers selected explicitly in code.
  ai:
    model:
      embedding: none
      chat: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${EMBEDDING_DIMENSIONS:1024}

server:
  port: ${SERVER_PORT:8081}
  address: 0.0.0.0

app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:auth-api}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${S3_BUCKET:file-upload-s3-demo-2026}
    download-url-expiry-seconds: ${S3_DOWNLOAD_URL_EXPIRY_SECONDS:300}
  embedding:
    default-provider: ${EMBEDDING_PROVIDER:ollama}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:bge-m3:latest}
    gemini:
      model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      api-key: ${GEMINI_API_KEY:}
  pdf:
    max-size-mb: ${MAX_PDF_SIZE_MB:20}
    max-pages: ${MAX_PDF_PAGES:200}
  chunking:
    chunk-size: ${CHUNK_SIZE:600}
    overlap: ${CHUNK_OVERLAP:80}
  storage:
    local-temp-dir: ${LOCAL_TEMP_DIR:./tmp/uploads}
  jobs:
    concurrency: ${JOB_CONCURRENCY:2}
    queue-capacity: ${JOB_QUEUE_CAPACITY:50}
    max-attempts: ${JOB_MAX_ATTEMPTS:3}
    retry-delay-ms: ${JOB_RETRY_DELAY_MS:5000}
    poll-interval-ms: ${JOB_POLL_INTERVAL_MS:1000}
    stale-running-seconds: ${JOB_STALE_RUNNING_SECONDS:900}
    job-expiry-seconds: ${JOB_EXPIRY_SECONDS:86400}
  cors:
    allowed-origins:
      - ${CORS_ORIGIN:http://localhost:3000}

logging:
  level:
    root: INFO
    com.processing_backend: INFO
