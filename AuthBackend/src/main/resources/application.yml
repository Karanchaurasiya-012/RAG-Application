spring:
  application:
    name: AuthBackend
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
    verification-token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:1h}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:auth-api}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

logging:
  level:
    root: INFO
    com.auth_backend: INFO
